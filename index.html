<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>諮詢師抽成試算系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold-bright: #F2D98C;
  --gold-main:   #E0C97E;
  --gold-deep:   #C4A85E;
  --gold-light:  #FAF3E0;
  --gold-pale:   #FDF8EE;
  --bg:          #F5F2EB;
  --surface:     #FDFCF8;
  --border:      #E4DECE;
  --border-mid:  #D4CAB8;
  --dark:        #1A1814;
  --text:        #2A2620;
  --text-mid:    #5A5248;
  --text-muted:  #9A9088;
  --danger:      #9E3A2F; --danger-bg: #F9EDEB;
  --warn:        #8A6020; --warn-bg:   #F7EED8;
  --info:        #2E5078; --info-bg:   #E8EFF8;
  --success:     #3A6645; --success-bg:#E8F2EB;
}

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-main) 55%, var(--gold-deep) 100%);
  padding: 2.25rem 1.5rem 2rem;
  text-align: center;
}
.header .en-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.62rem;
  letter-spacing: .28em;
  color: rgba(26,24,20,.55);
  text-transform: uppercase;
  margin-bottom: .5rem;
}
.header h1 {
  font-size: 1.3rem;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--dark);
  margin-bottom: .3rem;
}
.header p {
  font-size: 0.72rem;
  color: rgba(26,24,20,.5);
  letter-spacing: .06em;
  font-weight: 400;
}
.header-divider {
  width: 40px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(26,24,20,.25), transparent);
  margin: 1rem auto 0;
}

/* ── Page ── */
.page { max-width: 900px; margin: 0 auto; padding: 2rem 1rem 5rem; }

/* ── Two-column layout ── */
.top-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.25rem;
  align-items: start;
}
@media (max-width: 600px) {
  .top-row { grid-template-columns: 1fr; }
}

/* ── Section label ── */
.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.1rem;
}
.section-label::before {
  content: '';
  width: 3px; height: 14px;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
  border-radius: 2px;
  flex-shrink: 0;
}
.section-label span {
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gold-deep);
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
}
.card.full { margin-bottom: 1.25rem; }

/* ── Fields ── */
.fields { display: flex; flex-direction: column; gap: 1rem; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-size: 0.73rem;
  font-weight: 500;
  letter-spacing: .05em;
  color: var(--text-mid);
}
.input-wrap { position: relative; }
.input-prefix {
  position: absolute;
  left: 12px; top: 50%;
  transform: translateY(-50%);
  font-size: 0.85rem;
  color: var(--gold-main);
  pointer-events: none;
}
.field input {
  width: 100%;
  height: 44px;
  padding: 0 12px 0 28px;
  border: 1px solid var(--border-mid);
  border-radius: 12px;
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
  transition: border-color .2s, background .2s, box-shadow .2s;
}
.field input:focus {
  outline: none;
  border-color: var(--gold-main);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(207,174,82,.12);
}
.field input.filled {
  border-color: var(--gold-main);
  background: var(--gold-pale);
}
.field input::placeholder { color: var(--text-muted); font-weight: 300; }

/* ── Button ── */
.btn-calc {
  width: 100%;
  height: 46px;
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-main) 50%, var(--gold-deep) 100%);
  color: var(--dark);
  border: none;
  border-radius: 12px;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: .2em;
  cursor: pointer;
  margin-top: .75rem;
  transition: opacity .2s, transform .1s;
}
.btn-calc:hover { opacity: .88; }
.btn-calc:active { transform: scale(.99); }

/* ── Result rows ── */
.result-list { display: flex; flex-direction: column; }
.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.result-row:last-child { border-bottom: none; padding-bottom: 0; }
.result-row .label { font-size: 0.78rem; color: var(--text-muted); }
.result-row .value { font-size: 0.88rem; font-weight: 500; color: var(--text); }

/* ── Total box ── */
.result-total {
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-main) 55%, var(--gold-deep) 100%);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  margin-top: .75rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(207,174,82,.2);
}
.result-total .label {
  font-size: 0.72rem;
  letter-spacing: .1em;
  color: rgba(26,24,20,.6);
  font-weight: 500;
}
.result-total .value {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--dark);
}

/* ── Placeholder result state ── */
.result-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1rem;
  color: var(--text-muted);
  text-align: center;
  gap: .5rem;
}
.result-empty .icon {
  font-size: 1.5rem;
  opacity: .3;
}
.result-empty p { font-size: 0.78rem; font-weight: 300; letter-spacing: .06em; }

/* ── Badges ── */
.badge {
  display: inline-block;
  font-size: 0.63rem;
  padding: 2px 7px;
  border-radius: 2px;
  font-weight: 500;
  letter-spacing: .05em;
  margin-left: 6px;
  vertical-align: middle;
}
.badge-danger  { background: var(--danger-bg);  color: var(--danger); }
.badge-warn    { background: var(--warn-bg);    color: var(--warn); }
.badge-info    { background: var(--info-bg);    color: var(--info); }
.badge-good    { background: var(--success-bg); color: var(--success); }

/* ── Tier table ── */
.tier-wrap { overflow-x: auto; margin: 0 -1.5rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
thead tr { background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-main) 55%, var(--gold-deep) 100%); }
thead th {
  font-size: 0.67rem;
  font-weight: 500;
  letter-spacing: .08em;
  color: var(--dark);
  text-align: left;
  padding: 10px 14px;
  white-space: nowrap;
}
tbody td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-mid);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr.active-tier td {
  background: var(--gold-pale);
  color: var(--dark);
  font-weight: 500;
}
tbody tr.active-tier td:first-child {
  box-shadow: inset 3px 0 0 var(--gold-main);
}

.hint-msg { font-size: 0.7rem; color: var(--text-muted); margin-left: 5px; font-style: italic; }

footer {
  text-align: center;
  font-size: 0.68rem;
  color: var(--text-muted);
  letter-spacing: .08em;
  margin-top: 2.5rem;
}
</style>
</head>
<body>

<div class="header">
  <div class="en-label">Yours Aesthetic Medical Clinic</div>
  <h1>諮詢師抽成試算系統</h1>
  <p>月等效業績 ＝ 本月總業績 ÷ 諮詢點天數 × 應排班天數</p>
  <div class="header-divider"></div>
</div>

<div class="page">

  <!-- 左右並排 -->
  <div class="top-row">

    <!-- 左：輸入 -->
    <div class="card">
      <div class="section-label"><span>輸入資料</span></div>
      <div class="fields">
        <div class="field">
          <label>本月總業績（元）</label>
          <div class="input-wrap">
            <span class="input-prefix">$</span>
            <input type="number" id="totalSales" min="0" placeholder="請輸入金額" oninput="onInput(this); calc()">
          </div>
        </div>
        <div class="field">
          <label>本月諮詢點天數</label>
          <div class="input-wrap">
            <span class="input-prefix" style="font-size:.75rem">天</span>
            <input type="number" id="consultDays" min="0" max="31" placeholder="請輸入天數" oninput="onInput(this); calc()">
          </div>
        </div>
        <div class="field">
          <label>本月法定應排班天數</label>
          <div class="input-wrap">
            <span class="input-prefix" style="font-size:.75rem">天</span>
            <input type="number" id="scheduledDays" min="1" max="31" placeholder="請輸入天數" oninput="onInput(this); calc()">
          </div>
        </div>
      </div>
      <button class="btn-calc" onclick="calc()">開 始 試 算</button>
    </div>

    <!-- 右：結果 -->
    <div class="card" id="resultCard">
      <div class="section-label"><span>試算結果</span></div>
      <div id="resultInner">
        <div class="result-empty">
          <div class="icon">◈</div>
          <p>請輸入左側資料<br>結果將自動顯示</p>
        </div>
      </div>
    </div>

  </div>

  <!-- 對照表 -->
  <div class="card full">
    <div class="section-label"><span>抽成級距對照表</span></div>
    <div class="tier-wrap">
      <table>
        <thead>
          <tr>
            <th>月等效業績區間</th>
            <th>抽成比例</th>
            <th>當月抽成金額範圍</th>
            <th>職業適合度</th>
          </tr>
        </thead>
        <tbody id="tierBody"></tbody>
      </table>
    </div>
  </div>

  <footer>悅姿醫美診所 · 僅供內部計算參考使用</footer>
</div>

<script>
const TIERS = [
  { min: 0,       max: 999999,   rate: 0,      label: '0 ~ 999,999',           range: '0',                 title: '建議轉職',  cls: 'badge-danger' },
  { min: 1000000, max: 1499999,  rate: 0.0025, label: '1,000,000 ~ 1,499,999', range: '2,500 ~ 3,750',     title: '',          cls: '' },
  { min: 1500000, max: 1999999,  rate: 0.005,  label: '1,500,000 ~ 1,999,999', range: '7,500 ~ 10,000',    title: '普通諮詢師', cls: 'badge-warn' },
  { min: 2000000, max: 2499999,  rate: 0.0075, label: '2,000,000 ~ 2,499,999', range: '15,000 ~ 18,750',   title: '',          cls: '' },
  { min: 2500000, max: 2999999,  rate: 0.01,   label: '2,500,000 ~ 2,999,999', range: '25,000 ~ 30,000',   title: '資深諮詢師', cls: 'badge-info' },
  { min: 3000000, max: 3499999,  rate: 0.02,   label: '3,000,000 ~ 3,499,999', range: '60,000 ~ 70,000',   title: '',          cls: '' },
  { min: 3500000, max: 3999999,  rate: 0.03,   label: '3,500,000 ~ 3,999,999', range: '105,000 ~ 120,000', title: '',          cls: '' },
  { min: 4000000, max: 4499999,  rate: 0.04,   label: '4,000,000 ~ 4,499,999', range: '160,000 ~ 180,000', title: '',          cls: '' },
  { min: 4500000, max: 4999999,  rate: 0.05,   label: '4,500,000 ~ 4,999,999', range: '225,000 ~ 250,000', title: '',          cls: '' },
  { min: 5000000, max: Infinity, rate: 0.06,   label: '≥ 5,000,000',           range: '≥ 300,000',          title: '卓越表現',  cls: 'badge-good' },
];

function onInput(el) {
  el.classList.toggle('filled', el.value !== '');
}

function calc() {
  const total       = Number(document.getElementById('totalSales').value)    || 0;
  const consultDays = Number(document.getElementById('consultDays').value)   || 0;
  const scheduled   = Number(document.getElementById('scheduledDays').value) || 0;

  // 若三欄都空白，顯示預設狀態
  const anyFilled = document.getElementById('totalSales').value !== ''
                 || document.getElementById('consultDays').value !== ''
                 || document.getElementById('scheduledDays').value !== '';

  if (!anyFilled) {
    document.getElementById('resultInner').innerHTML = `
      <div class="result-empty">
        <div class="icon">◈</div>
        <p>請輸入左側資料<br>結果將自動顯示</p>
      </div>`;
    renderTierTable(null);
    return;
  }

  const ready = consultDays > 0 && scheduled > 0;
  const equiv = ready ? Math.round(total / consultDays * scheduled) : 0;
  const tier  = TIERS.find(t => equiv >= t.min && equiv <= t.max) || TIERS[0];
  const commission = Math.round(total * tier.rate);

  const titleBadge = tier.title ? `<span class="badge ${tier.cls}">${tier.title}</span>` : '';
  const hintMsg    = !ready ? `<span class="hint-msg">請填寫天數</span>` : '';

  document.getElementById('resultInner').innerHTML = `
    <div class="result-list">
      <div class="result-row"><span class="label">本月總業績</span><span class="value">$${total.toLocaleString()}</span></div>
      <div class="result-row"><span class="label">本月諮詢點天數</span><span class="value">${consultDays || '—'}${consultDays ? ' 天' : ''}</span></div>
      <div class="result-row"><span class="label">本月法定應排班天數</span><span class="value">${scheduled || '—'}${scheduled ? ' 天' : ''}</span></div>
      <div class="result-row"><span class="label">等效月業績</span><span class="value">${ready ? '$' + equiv.toLocaleString() : '<span style="color:var(--text-muted)">—</span>'}${hintMsg}</span></div>
      <div class="result-row"><span class="label">抽成比例</span><span class="value">${(tier.rate * 100).toFixed(2)}%${titleBadge}</span></div>
    </div>
    <div class="result-total">
      <span class="label">本月總抽成</span>
      <span class="value">$${commission.toLocaleString()}</span>
    </div>
  `;

  renderTierTable(ready ? tier : null);
}

function renderTierTable(activeTier) {
  document.getElementById('tierBody').innerHTML = TIERS.map(t => `
    <tr class="${t === activeTier ? 'active-tier' : ''}">
      <td>${t.label}</td>
      <td>${(t.rate * 100).toFixed(2)}%</td>
      <td>${t.range}</td>
      <td>${t.title ? `<span class="badge ${t.cls}">${t.title}</span>` : '—'}</td>
    </tr>`).join('');
}

renderTierTable(null);
</script>
</body>
</html>
